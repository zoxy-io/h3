name: sim

# One workflow per gate, so each carries its own badge and its own result. A
# single matrix job that ran everything could only ever say "something broke".
# They share `.github/actions/zig`, which is where the toolchain version lives.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every gate only reads the tree. Declared rather than
# inherited, so a change to the repository default cannot widen it silently.
permissions:
  contents: read

jobs:
  sim:
    runs-on: ubuntu-latest
    strategy:
      # Every leg runs even when one fails. `-Dassertions=false` in Debug
      # removes the `if (!ok)` and nothing else — the condition is still
      # evaluated and a safety check inside one still traps — so only a release
      # mode tests the elision, and only a release mode reaches the undefined
      # behaviour a `catch unreachable` guarded by a removed assertion becomes.
      # That distinction is not academic: it is how a livelock in an encoder
      # path in h2 reached review rather than CI.
      fail-fast: false
      matrix:
        include:
          - name: Debug, assertions on
            flags: ""
          - name: ReleaseFast, assertions on
            flags: "-Doptimize=ReleaseFast"
          - name: ReleaseFast, assertions off
            flags: "-Doptimize=ReleaseFast -Dassertions=false"
    name: sim (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/zig
      # 256 seeds of the seeded network simulation, with its oracles and its
      # coverage census. The census is half the gate: a behaviour no seed
      # reached fails the run rather than passing quietly.
      - name: sim
        run: zig build sim ${{ matrix.flags }}
