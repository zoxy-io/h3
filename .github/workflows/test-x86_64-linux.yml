name: test-x86_64-linux

on: [push, pull_request]

jobs:
  build:
    strategy:
      # Every target is exercised even when one fails, so a
      # platform-specific break is not masked by a faster one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        target: [x86_64-linux-gnu, x86_64-linux-musl]
    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.os }}, ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # `ci` is fmt + test + lint. Running the whole step rather than
      # `zig build test` keeps CI and a local check from checking different
      # things — the reason the gates are build steps at all.
      - name: Gates
        run: zig build ci -Dtarget=${{ matrix.target }}

      # The two builds that actually ship, because the Debug leg above does not
      # exercise either. `-Dassertions=false` in Debug removes the `if (!ok)`
      # and nothing else — the condition is still evaluated, and a safety check
      # inside one still traps — so it tests that the package compiles and
      # behaves without assertions, not that they are gone. Only a release mode
      # tests the elision, and only a release mode reaches the undefined
      # behaviour a `catch unreachable` guarded by a removed assertion becomes.
      # That distinction is not academic: it is how a livelock in
      # an encoder path in h2 reached review rather than CI.
      - name: Gates, zoxy's build (ReleaseFast, assertions on)
        run: zig build ci -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast

      - name: Gates, zrk's build (ReleaseFast, assertions off)
        run: zig build ci -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Dassertions=false

      # Not a measurement — a shared runner cannot produce a comparable band.
      # This only proves the benchmark still compiles and runs, so it cannot
      # rot between the days someone reads its numbers.
      - name: Benchmark smoke
        run: zig build bench -Druns=1 -Diterations=1000
